<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="190" viewBox="0 0 1050 190" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Profile Trophies</title>
  <desc id="desc">A decorative GitHub-themed trophy banner. This is a static graphic, not live achievement data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21102f"/>
      <stop offset="1" stop-color="#3a1748"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="0.55" stop-color="#ffbf47"/>
      <stop offset="1" stop-color="#e87924"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1048" height="188" rx="18" fill="url(#bg)" stroke="#a855f7" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="62" cy="35" r="2" fill="#f0abfc"/><circle cx="101" cy="150" r="3" fill="#f0abfc"/><circle cx="965" cy="35" r="2" fill="#f0abfc"/><circle cx="1000" cy="143" r="3" fill="#f0abfc"/>
  <g transform="translate(54 37)" filter="url(#glow)">
    <path d="M27 7h42v13c0 20-9 32-21 36C36 52 27 40 27 20z" fill="url(#gold)" stroke="#fff0bd" stroke-width="2"/>
    <path d="M27 15H12v8c0 14 9 22 22 22M69 15h15v8c0 14-9 22-22 22" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M48 56v15M34 73h28" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="m48 17 4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#fff7d6"/>
  </g>
  <text x="160" y="62" fill="#f5d0fe" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">GITHUB PROFILE</text>
  <text x="158" y="105" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Trophies &amp; Achievements</text>
  <text x="160" y="137" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="16">Keep building. Keep contributing. Keep learning.</text>
  <g transform="translate(690 42)">
    <g transform="translate(0 0)"><rect width="78" height="96" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#d8b4fe" stroke-opacity=".55"/><circle cx="39" cy="29" r="17" fill="#fbbf24"/><path d="m39 17 4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#fff7d6"/><rect x="20" y="57" width="38" height="5" rx="2.5" fill="#e9d5ff"/><rect x="27" y="68" width="24" height="4" rx="2" fill="#c084fc"/></g>
    <g transform="translate(91 0)"><rect width="78" height="96" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#d8b4fe" stroke-opacity=".55"/><path d="M39 12 45 27 61 28 49 39 52 55 39 47 26 55 29 39 17 28 33 27z" fill="#c4b5fd"/><rect x="20" y="65" width="38" height="5" rx="2.5" fill="#e9d5ff"/><rect x="27" y="76" width="24" height="4" rx="2" fill="#c084fc"/></g>
    <g transform="translate(182 0)"><rect width="78" height="96" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#d8b4fe" stroke-opacity=".55"/><path d="M39 11 58 22 58 43 39 55 20 43 20 22z" fill="#fb7185"/><path d="m39 20 4 9 10 1-8 7 2 9-8-5-8 5 2-9-8-7 10-1z" fill="#fff1f2"/><rect x="20" y="65" width="38" height="5" rx="2.5" fill="#e9d5ff"/><rect x="27" y="76" width="24" height="4" rx="2" fill="#c084fc"/></g>
  </g>
  <text x="525" y="172" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">STATIC PROFILE BANNER · NOT LIVE GITHUB ACHIEVEMENT DATA</text>
</svg>
